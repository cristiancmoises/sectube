services:
  sectube:
    build:
      # Self-contained build: compiles the React bundle INSIDE Docker, so a
      # fresh clone deploys with a single `docker compose up -d --build` — no
      # separate `dist/` build step. (Low-RAM host? Switch this to `Dockerfile`
      # and run `./scripts/build.sh` first; see README "Low-memory hosts".)
      context: .
      dockerfile: Dockerfile.full-build
    image: sectube:latest
    pull_policy: build
    container_name: sectube
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      # Read by the Lua rotator via the environment — never baked into the image
      # and never written into the rendered config on disk.
      # GOOGLE_API_KEYS: many keys, comma-separated, rotated to dodge quota.
      GOOGLE_API_KEYS: "${GOOGLE_API_KEYS:-}"
      # GOOGLE_API_KEY: single-key back-compat; merged in with GOOGLE_API_KEYS.
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GOOGLE_API_HOST: "${GOOGLE_API_HOST:-youtube.googleapis.com}"
      # Set to the key's allowed HTTP referrer if your key is referrer-restricted
      # (e.g. http://localhost:8090). Leave empty for unrestricted/IP-restricted keys.
      GOOGLE_API_REFERER: "${GOOGLE_API_REFERER:-}"
      NGINX_RESOLVERS: "${NGINX_RESOLVERS:-1.1.1.1 8.8.8.8 9.9.9.9}"
      # Rotation + cache tuning (all optional; sane defaults in rotator.lua).
      GOOGLE_KEY_QUOTA_COOLDOWN: "${GOOGLE_KEY_QUOTA_COOLDOWN:-}"
      GOOGLE_KEY_RATE_COOLDOWN: "${GOOGLE_KEY_RATE_COOLDOWN:-}"
      GOOGLE_KEY_BAD_COOLDOWN: "${GOOGLE_KEY_BAD_COOLDOWN:-}"
      GOOGLE_API_CACHE_TTL: "${GOOGLE_API_CACHE_TTL:-}"
    env_file:
      - path: .env
        required: false
    dns:
      - ${DOCKER_DNS:-1.1.1.1}
      - 8.8.8.8
      - 9.9.9.9
    # --- Hardening ----------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      # Re-enabled on the OpenResty base (the old removal was a workaround for the
      # nginx-unprivileged image; verified working here). Blocks setuid privilege
      # escalation inside the container.
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
