# Minimal main nginx config for SecTube.
# The real server block lives in /tmp/default.conf, rendered at boot by the
# entrypoint. We keep the main config tiny and deterministic so upgrades of
# the base image can't surprise us with auto-loaded snippets.

# Use a writable location for the pid. The default /var/run is tmpfs in our
# compose file, but nginx-unprivileged already expects /tmp/nginx.pid.
pid /tmp/nginx.pid;

# Match the base image so logs end up wherever the operator expects.
error_log /dev/stderr warn;

# Auto is usually right; override here if you want to pin.
worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access log to stdout so `docker logs` captures it.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log /dev/stdout main;

    # Performance defaults.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Writable paths under read-only rootfs must be under tmpfs mounts.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # The server block and limit_req_zone come from here, rendered at boot.
    include /tmp/default.conf;
}
