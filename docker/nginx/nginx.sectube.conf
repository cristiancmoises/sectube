# Main OpenResty config for SecTube.
# The real server block lives in /tmp/default.conf, rendered at boot by the
# entrypoint. We keep the main config tiny and deterministic so upgrades of
# the base image can't surprise us with auto-loaded snippets.

# Use a writable location for the pid (rootfs is read-only; /tmp is tmpfs).
pid /tmp/nginx.pid;

# Match the base image so logs end up wherever the operator expects.
error_log /dev/stderr warn;

# Auto is usually right; override here if you want to pin.
worker_processes auto;

# ---------------------------------------------------------------------------
# Expose the API-key environment to the Lua runtime. These vars are read with
# os.getenv() inside init_by_lua and never written to disk (see rotator.lua).
# `env` is a main-context directive — it MUST live out here, not in http {}.
# ---------------------------------------------------------------------------
env GOOGLE_API_KEYS;
env GOOGLE_API_KEY;
env GOOGLE_KEY_QUOTA_COOLDOWN;
env GOOGLE_KEY_RATE_COOLDOWN;
env GOOGLE_KEY_BAD_COOLDOWN;
env GOOGLE_API_CACHE_TTL;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Access log to stdout so `docker logs` captures it.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" cache=$sent_http_x_cache';
    access_log /dev/stdout main;

    # Performance defaults.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Writable paths under read-only rootfs must be under tmpfs mounts.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # ---- Lua runtime ------------------------------------------------------
    # Our module dir first, then OpenResty defaults (cjson.safe, resty.core…).
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Key health (round-robin cursor + per-key cooldown markers) shared across
    # workers; and a short-TTL response cache so identical upstream calls from
    # many users cost one quota hit.
    lua_shared_dict yt_state 1m;
    lua_shared_dict yt_cache 64m;

    # Parse API keys + tunables from the environment exactly once at startup.
    init_by_lua_block {
        require("rotator").init()
    }

    # Reuse upstream TLS connections to Google for lower latency.
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 3;

    # The server block, resolver and limit_req_zone come from here, rendered
    # at boot from the template.
    include /tmp/default.conf;
}
