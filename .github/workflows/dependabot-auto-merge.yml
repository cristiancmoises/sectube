name: Dependabot auto-merge

# Auto-merges Dependabot PRs for PATCH and MINOR version updates once the PR
# is mergeable and all required status checks pass (GitHub native auto-merge).
# MAJOR version bumps are intentionally left for manual review.
#
# Prerequisite: repo Settings -> General -> "Allow auto-merge" must be enabled.
# Recommended: make the CodeQL check a required status check (branch protection)
# so merges wait for a green scan before completing.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch & minor only)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
